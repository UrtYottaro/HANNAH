name: Build Windows app

# タグ（例: v0.4.0）を付けて push すると、Windows 用インストーラーを作り、Releases に添付する。
# Actions タブの「Run workflow」から、手動で試し作りもできる（成果物は Artifacts に出る）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: HANNAH-Windows
          path: release/HANNAH-Setup-*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/HANNAH-Setup-*.exe
