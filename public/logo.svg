<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">HANNAH — AとHのモノグラム</title>
  <desc id="desc">左の線を斜めに、右の線を垂直にした黒一色のAとHの記号。内側の4か所に同じ大きさの柔らかなカーブ。左右の上端と下端の水平な辺はすべて24。上端同士は接続し、下端同士の間隔は24の白いマス3つ分、72。</desc>
